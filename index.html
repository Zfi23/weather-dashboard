<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Realistic Earth Weather</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body {
            background: #030814;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* الخلفية الفضائية */
        .space {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, #0c1b33 0%, #02050a 100%);
            z-index: 0;
        }

        /* النجوم */
        .stars {
            position: absolute;
            width: 100%; height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 40px 70px, #fff, transparent),
                radial-gradient(1px 1px at 90px 40px, #ddd, transparent);
            background-size: 200px 100px;
            opacity: 0.8;
        }

        /* حاوية الكرة الأرضية (الدوران) */
        .earth-container {
            position: absolute;
            top: 50%; left: 50%;
            width: 450px; height: 450px;
            transform: translate(-50%, -50%);
            z-index: 1;
            border-radius: 50%;
            box-shadow: 0 0 100px rgba(30, 100, 200, 0.3), inset 0 0 50px rgba(0,0,0,0.8);
            animation: slowSpin 60s linear infinite;
        }

        @keyframes slowSpin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* الكرة الأرضية (صورة ناسا) */
        .earth-texture {
            width: 100%; height: 100%;
            border-radius: 50%;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Blue_Marble_2002.png/1280px-Blue_Marble_2002.png');
            background-size: cover;
            background-position: center;
            box-shadow: inset -50px -50px 100px rgba(0,0,0,0.7);
        }

        /* طبقة الغيوم المتحركة فوق الأرض */
        .cloud-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/e6/World_clouds_%28NASA%29.jpg/1280px-World_clouds_%28NASA%29.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.5;
            mix-blend-mode: screen;
            animation: spinClouds 30s linear infinite;
            z-index: 2;
        }

        @keyframes spinClouds {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- واجهة المستخدم (الزجاجية) --- */
        .ui-layer {
            position: absolute;
            top: 20px; left: 20px; right: 20px; bottom: 20px;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .interactive { pointer-events: auto; }

        .glass {
            background: rgba(8, 15, 30, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 15px 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            color: white;
        }

        /* الشريط العلوي */
        .top-bar {
            display: flex; justify-content: center; width: 100%;
        }
        .search-box {
            display: flex; align-items: center; gap: 10px;
            background: rgba(0, 0, 0, 0.7); border-radius: 30px;
            padding: 8px 20px; width: 90%; max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .search-box input {
            flex: 1; background: transparent; border: none; color: white;
            outline: none; font-size: 14px; padding: 5px;
        }
        .search-box input::placeholder { color: #888; }
        .search-box button {
            background: none; border: none; color: #f1c40f;
            font-size: 18px; cursor: pointer;
        }

        /* اليسار (الطقس) */
        .left-panel {
            position: absolute; top: 80px; left: 0px; width: 200px;
        }
        .weather-main { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
        .weather-main .temp { font-size: 36px; font-weight: 700; }
        .weather-main .icon { font-size: 28px; color: #f1c40f; }
        .row { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* اليمين (المدينة) */
        .right-panel {
            position: absolute; top: 80px; right: 0px; width: 200px; text-align: right;
        }
        .city-card h2 { font-size: 22px; color: #f1c40f; margin: 0 0 5px 0; }
        .city-card .sub { font-size: 13px; color: #ccc; }

        /* الأسفل (التوقعات) */
        .forecast-bar {
            position: absolute; bottom: 0px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px); padding: 10px 20px;
            border-radius: 30px; border: 1px solid rgba(255,255,255,0.05);
            min-width: 300px; justify-content: center;
        }
        .f-item {
            text-align: center; font-size: 12px; min-width: 35px;
        }
        .f-item .day { color: #aaa; }
        .f-item .deg { font-weight: bold; font-size: 15px; }

        /* التجاوب مع الشاشات الصغيرة */
        @media (max-width: 700px) {
            .earth-container { width: 300px; height: 300px; }
            .left-panel { width: 150px; top: 70px; }
            .right-panel { width: 150px; top: 70px; }
            .weather-main .temp { font-size: 28px; }
        }
    </style>
</head>
<body>

    <!-- طبقات الخلفية والكرة الأرضية -->
    <div class="space">
        <div class="stars"></div>
        <div class="earth-container">
            <div class="earth-texture"></div>
            <div class="cloud-layer"></div>
        </div>
    </div>

    <!-- واجهة المستخدم -->
    <div class="ui-layer">
        <div class="top-bar interactive">
            <div class="search-box">
                <input type="text" id="cityInput" placeholder="Search city..." value="Dubai">
                <button onclick="searchWeather()">🔍</button>
            </div>
        </div>

        <div class="left-panel interactive glass">
            <div class="weather-main">
                <div class="icon" id="wIcon">☀️</div>
                <div class="temp" id="wTemp">--°C</div>
            </div>
            <div style="font-size:13px; color:#ccc;" id="wDesc">Loading...</div>
            <div class="row"><span>💧 Humidity</span><span id="wHumid">--%</span></div>
            <div class="row"><span>💨 Wind</span><span id="wWind">-- km/h</span></div>
        </div>

        <div class="right-panel interactive glass city-card">
            <h2 id="cityName">Dubai, AE</h2>
            <div class="sub" id="cDesc">Clear sky</div>
        </div>

        <div class="forecast-bar interactive" id="forecastContainer">
            <div class="f-item"><div class="day">Fri</div><div class="deg">--°</div></div>
            <div class="f-item"><div class="day">Sat</div><div class="deg">--°</div></div>
            <div class="f-item"><div class="day">Sun</div><div class="deg">--°</div></div>
            <div class="f-item"><div class="day">Mon</div><div class="deg">--°</div></div>
        </div>
    </div>

    <script>
        const API_KEY = "8cfbdd362db68d9f6f10a8afc288c3aa";
        const WEATHER_URL = "https://api.openweathermap.org/data/2.5/";

        async function searchWeather() {
            const city = document.getElementById('cityInput').value.trim() || "Dubai";
            try {
                const res = await fetch(`${WEATHER_URL}weather?q=${city}&appid=${API_KEY}&units=metric`);
                if (!res.ok) throw new Error("City not found");
                const data = await res.json();
                updateUI(data);
                updateForecast(city);
            } catch (e) {
                // تجاهل الأخطاء حتى لا تظهر رسائل مزعجة أثناء التحميل
            }
        }

        function updateUI(data) {
            document.getElementById('wTemp').innerText = `${Math.round(data.main.temp)}°C`;
            document.getElementById('wDesc').innerText = data.weather[0].description;
            document.getElementById('wHumid').innerText = `${data.main.humidity}%`;
            document.getElementById('wWind').innerText = `${Math.round(data.wind.speed * 3.6)} km/h`;
            document.getElementById('cityName').innerText = `${data.name}, ${data.sys.country}`;
            document.getElementById('cDesc').innerText = data.weather[0].description;

            let icon = "☀️";
            const id = data.weather[0].id;
            if (id >= 200 && id < 300) icon = "⛈️";
            else if (id >= 300 && id < 500) icon = "🌦️";
            else if (id >= 500 && id < 600) icon = "🌧️";
            else if (id >= 600 && id < 700) icon = "❄️";
            else if (id >= 700 && id < 800) icon = "🌫️";
            else if (id === 800) icon = "☀️";
            else if (id > 800) icon = "☁️";
            document.getElementById('wIcon').innerText = icon;
        }

        async function updateForecast(city) {
            try {
                const res = await fetch(`${WEATHER_URL}forecast?q=${city}&appid=${API_KEY}&units=metric`);
                const data = await res.json();
                const container = document.getElementById('forecastContainer');
                container.innerHTML = '';
                const daily = data.list.filter(item => item.dt_txt.includes("12:00:00"));
                daily.slice(0, 5).forEach(day => {
                    const date = new Date(day.dt * 1000);
                    const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                    const item = document.createElement('div');
                    item.className = 'f-item';
                    item.innerHTML = `<div class="day">${dayName}</div><div class="deg">${Math.round(day.main.temp)}°</div>`;
                    container.appendChild(item);
                });
            } catch (e) {}
        }

        window.onload = searchWeather;
        document.getElementById('cityInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') searchWeather(); });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AeroLive - 3D Earth & Clouds</title>
    
    <!-- استدعاء محرك Cesium -->
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            background: #030a16; 
            overflow: hidden; 
            height: 100vh; 
            color: white; 
        }

        /* خلفية الشاشة - لا تقلق، Cesium سيرسم خلفية الفضاء */
        #cesiumContainer { 
            width: 100vw; 
            height: 100vh; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 0; 
        }

        /* --- واجهة المستخدم فوق الكرة الأرضية --- */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* السماح بالنقر عبر الـ UI */
            padding: 20px;
        }

        .ui-element {
            pointer-events: auto;
        }

        /* تنسيق الزجاج الشفاف */
        .glass {
            background: rgba(10, 15, 30, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            color: white;
        }

        /* --- الشريط العلوي --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #f1c40f;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 8px 20px;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 14px;
            width: 180px;
        }
        .search-box input::placeholder { color: #aaa; }
        .search-box button {
            background: none;
            border: none;
            color: #aaa;
            font-size: 16px;
            cursor: pointer;
        }
        .search-box button:hover { color: #f1c40f; }

        /* --- القائمة الجانبية (اليسار) --- */
        .side-panel {
            position: absolute;
            top: 80px;
            left: 20px;
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .weather-card .temp {
            font-size: 42px;
            font-weight: 700;
        }
        .weather-card i {
            font-size: 36px;
            color: #f1c40f;
            vertical-align: middle;
        }
        .weather-detail {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #ccc;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        /* --- بطاقة المدينة (اليمين) --- */
        .city-card {
            position: absolute;
            top: 80px;
            right: 20px;
            width: 200px;
            text-align: center;
            padding: 20px;
        }
        .city-card h2 {
            color: #f1c40f;
            margin-bottom: 5px;
        }
        .city-card .big-temp { font-size: 36px; font-weight: bold; }
        .city-card .sub { font-size: 12px; color: #aaa; }

        /* --- شريط التوقعات (الأسفل) --- */
        .forecast-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            padding: 15px 25px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .forecast-item {
            text-align: center;
            font-size: 13px;
            min-width: 50px;
        }
        .forecast-item .day { color: #aaa; }
        .forecast-item i { font-size: 20px; margin: 3px 0; color: #f1c40f; }
        .forecast-item .deg { font-weight: 600; }

        /* --- شاشة التحميل --- */
        .loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #030a16;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #f1c40f;
            font-size: 18px;
            flex-direction: column;
            gap: 20px;
            transition: opacity 0.8s;
        }
        .loader.hidden { opacity: 0; pointer-events: none; }
        .lds-dual-ring { display: inline-block; width: 50px; height: 50px; }
        .lds-dual-ring:after {
            content: " "; display: block; width: 40px; height: 40px; margin: 5px;
            border-radius: 50%; border: 4px solid #f1c40f; border-color: #f1c40f transparent #f1c40f transparent;
            animation: spin 1.2s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="loader" id="loader">
        <div class="lds-dual-ring"></div>
        <span>Launching Earth, Clouds & Wind...</span>
    </div>

    <!-- حاوية الكرة الأرضية -->
    <div id="cesiumContainer"></div>

    <!-- واجهة المستخدم -->
    <div class="ui-layer">
        <!-- الشريط العلوي -->
        <div class="top-bar ui-element">
            <div class="logo"><i class="fas fa-globe-americas"></i> AeroLive</div>
            <div class="search-box">
                <input type="text" id="cityInput" placeholder="Search location..." value="Dubai">
                <button onclick="searchCity()"><i class="fas fa-search"></i></button>
            </div>
        </div>

        <!-- القائمة اليسرى -->
        <div class="side-panel ui-element">
            <div class="glass weather-card">
                <h4 style="color:#aaa; margin-bottom:5px;">Current Weather</h4>
                <div class="temp"><i class="fas fa-sun" id="wIcon"></i> <span id="wTemp">--°C</span></div>
                <div style="font-size:14px; color:#ccc;" id="wDesc">Loading...</div>
                <div class="weather-detail"><span>💧 Humidity</span><span id="wHumid">--%</span></div>
                <div class="weather-detail"><span>💨 Wind</span><span id="wWind">-- km/h</span></div>
            </div>
        </div>

        <!-- بطاقة المدينة (يمين) -->
        <div class="city-card glass ui-element">
            <h2 id="cityName">Dubai, UAE</h2>
            <div class="big-temp"><span id="cTemp">--°C</span></div>
            <div class="sub" id="cDesc">Clear Skies</div>
            <div class="sub" style="color:#888; font-size:11px;">Feels like <span id="cFeels">--°C</span></div>
        </div>

        <!-- التوقعات (أسفل) -->
        <div class="forecast-bar ui-element" id="forecastContainer">
            <!-- سيتم إنشاؤها بواسطة JS -->
            <div style="color:#888;">Loading Forecast...</div>
        </div>
    </div>

    <script>
        // --- 1. تشغيل الكرة الأرضية (Cesium) ---
        // هذا المفتاح هو مفتاح تجريبي عام من Cesium للسماح بعرض الكرة الأرضية والغيوم.
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI5NTk3YzRlMC1hYzA2LTRjOTMtOTY3Ni04N2E5MDFjOTVjMjciLCJpZCI6MjU5NzY3LCJpYXQiOjE3MzE3OTg4NzV9.BqYt3rPghc1e_mZ-C55tJ_IQg6Td_BI3F1qkXmD_m3o';

        const viewer = new Cesium.Viewer('cesiumContainer', {
            terrainProvider: Cesium.createWorldTerrain(),
            skyBox: new Cesium.SkyBox({
                sources: {
                    positiveX: 'https://cesiumjs.org/skybox/px.png',
                    negativeX: 'https://cesiumjs.org/skybox/nx.png',
                    positiveY: 'https://cesiumjs.org/skybox/py.png',
                    negativeY: 'https://cesiumjs.org/skybox/ny.png',
                    positiveZ: 'https://cesiumjs.org/skybox/pz.png',
                    negativeZ: 'https://cesiumjs.org/skybox/nz.png'
                }
            }),
            animation: false,
            timeline: false,
            navigationHelpButton: false,
            selectionIndicator: false,
            infoBox: false,
            baseLayerPicker: false,
            geocoder: false,
            homeButton: false,
            sceneModePicker: false,
        });

        // إعدادات الإضاءة والغيوم
        viewer.scene.globe.enableLighting = true;
        viewer.scene.globe.depthTestAgainstTerrain = true;
        viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(55.27, 25.20, 15000000),
            orientation: { heading: 0, pitch: -0.3, roll: 0 },
            duration: 4 // مدة الطيران السلس
        });

        // --- 2. إضافة الغيوم ثلاثية الأبعاد المتحركة (The Magic Part) ---
        // إضافة طبقة الغيوم من خدمة Cesium
        viewer.scene.primitives.add(
            new Cesium.CloudPrimitive({
                cloudType: Cesium.CloudType.VOLUMETRIC,
                maximumClouds: 4000, // عدد الغيوم
                cloudTexture: Cesium.loadImage('https://cesiumjs.org/images/cloud.png'),
                cloudSpeed: 0.005 // سرعة حركة الغيوم
            })
        );
        
        // تشغيل الرياح (ملاحظة: الرياح متاحة تجارياً، لكننا نكتفي بالغيوم والكرة الأرضية هنا)

        // إخفاء التحميل
        setTimeout(() => { document.getElementById('loader').classList.add('hidden'); }, 3000);

        // --- 3. دوال الطقس ---
        const API_KEY = "8cfbdd362db68d9f6f10a8afc288c3aa";
        const WEATHER_URL = "https://api.openweathermap.org/data/2.5/";

        async function searchCity() {
            const city = document.getElementById('cityInput').value.trim() || "Dubai";
            try {
                const res = await fetch(`${WEATHER_URL}weather?q=${city}&appid=${API_KEY}&units=metric`);
                if (!res.ok) throw new Error("City not found");
                const data = await res.json();
                
                // تحديث الـ UI
                document.getElementById('cityName').innerText = `${data.name}, ${data.sys.country}`;
                document.getElementById('wTemp').innerText = `${Math.round(data.main.temp)}°C`;
                document.getElementById('wDesc').innerText = data.weather[0].description;
                document.getElementById('wHumid').innerText = `${data.main.humidity}%`;
                document.getElementById('wWind').innerText = `${Math.round(data.wind.speed * 3.6)} km/h`;
                document.getElementById('cTemp').innerText = `${Math.round(data.main.temp)}°C`;
                document.getElementById('cDesc').innerText = data.weather[0].description;
                document.getElementById('cFeels').innerText = `${Math.round(data.main.feels_like)}°C`;

                // أيقونة
                const id = data.weather[0].id;
                let icon = "fa-sun";
                if(id >= 200 && id < 300) icon = "fa-bolt";
                else if(id >= 300 && id < 500) icon = "fa-cloud-rain";
                else if(id >= 500 && id < 600) icon = "fa-cloud-showers-heavy";
                else if(id >= 600 && id < 700) icon = "fa-snowflake";
                else if(id >= 700 && id < 800) icon = "fa-smog";
                else if(id > 800) icon = "fa-cloud";
                document.getElementById('wIcon').className = `fas ${icon}`;

                // التوجه للمدينة على الكرة الأرضية
                viewer.camera.flyTo({
                    destination: Cesium.Cartesian3.fromDegrees(data.coord.lon, data.coord.lat, 8000000),
                    duration: 2
                });

            } catch (error) {
                alert("City not found. Please check the spelling.");
            }
        }

        // تشغيل البحث
        document.querySelector('.search-box button').addEventListener('click', searchCity);
        document.getElementById('cityInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchCity();
        });

        // تشغيل أولي
        window.onload = searchCity;
    </script>
</body>
</html>

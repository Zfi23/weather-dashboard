<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Weather Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; }
        body {
            background: #eef2f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .dashboard {
            width: 100%; max-width: 900px;
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 40px; padding: 25px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08); display: flex; flex-wrap: wrap; gap: 25px;
            position: relative; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .bg-clouds {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
            background: radial-gradient(circle at 20% 20%, rgba(255,215,0,0.05), transparent 40%),
                        radial-gradient(circle at 80% 80%, rgba(100,149,237,0.05), transparent 40%);
        }
        .left-panel {
            flex: 1.2; min-width: 280px;
            background: linear-gradient(160deg, #5b5fee, #3b3b98);
            border-radius: 30px; padding: 25px; color: white; position: relative; z-index: 1; overflow: hidden;
            box-shadow: 0 15px 40px rgba(91, 95, 238, 0.3); transition: background 0.8s ease;
        }
        .left-panel::before {
            content: ''; position: absolute; top: -30%; right: -20%;
            width: 80%; height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
            border-radius: 50%; z-index: 0;
        }
        .left-header { display: flex; justify-content: space-between; font-size: 12px; opacity: 0.8; position: relative; z-index: 1; }
        .left-city { font-size: 22px; font-weight: 600; margin-top: 5px; position: relative; z-index: 1; }
        .left-main-temp { font-size: 80px; font-weight: 300; position: relative; z-index: 1; line-height: 1; margin: 10px 0; }
        .left-main-temp span { font-size: 30px; font-weight: 400; margin-left: 5px; }
        .left-desc { font-size: 14px; opacity: 0.8; margin-bottom: 20px; position: relative; z-index: 1; text-transform: capitalize; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; position: relative; z-index: 1; }
        .stat-box {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px);
            border-radius: 16px; padding: 12px; text-align: left; border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s; cursor: default;
        }
        .stat-box:hover { background: rgba(255,255,255,0.2); transform: translateY(-3px); }
        .stat-box .icon { font-size: 16px; display: block; margin-bottom: 3px; opacity: 0.7; }
        .stat-box .val { font-size: 16px; font-weight: 600; }
        .stat-box .lbl { font-size: 10px; opacity: 0.6; margin-top: 2px; }
        .right-panel { flex: 2; min-width: 300px; z-index: 1; position: relative; }
        .forecast-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; }
        .forecast-card {
            background: rgba(248, 250, 252, 0.8); border-radius: 30px; padding: 20px 10px;
            text-align: center; transition: 0.4s; border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 5px 15px rgba(0,0,0,0.02); display: flex; flex-direction: column; align-items: center;
        }
        .forecast-card:hover { transform: translateY(-5px); background: #ffffff; box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
        .forecast-card .day { font-weight: 700; color: #333; font-size: 14px; }
        .forecast-card .date { font-size: 11px; color: #999; margin-bottom: 5px; }
        .weather-icon-box { font-size: 48px; margin: 10px auto; display: block; color: #5b5fee; }
        .forecast-card .temp-range { font-size: 16px; font-weight: 600; color: #333; margin: 5px 0; }
        .forecast-card .condition { font-size: 12px; color: #666; font-weight: 600; text-transform: uppercase; }
        .vibe-badge { display: inline-block; background: rgba(91, 95, 238, 0.1); color: #5b5fee; padding: 4px 14px; border-radius: 20px; font-size: 10px; font-weight: 700; margin-top: 8px; letter-spacing: 0.5px; }
        .search-bar { position: absolute; top: 25px; right: 30px; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border-radius: 25px; padding: 5px 15px; z-index: 10; width: 200px; border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
        .search-bar input { border: none; background: transparent; outline: none; font-size: 13px; padding: 8px 0; width: 100%; color: #444; }
        .search-bar button { border: none; background: none; cursor: pointer; color: #888; font-size: 14px; transition: 0.2s; }
        .search-bar button:hover { color: #5b5fee; }
        @media (max-width: 750px) {
            .dashboard { flex-direction: column; border-radius: 20px; padding: 15px; }
            .left-panel { width: 100%; border-radius: 20px; }
            .search-bar { position: relative; top: 0; right: 0; width: 100%; margin-bottom: 15px; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="bg-clouds"></div>
        <div class="search-bar">
            <input type="text" id="cityInput" placeholder="Search city..." value="Dubai">
            <button onclick="searchWeather()">🔍</button>
        </div>
        <div class="left-panel" id="leftPanel">
            <div class="left-header">
                <span id="currentDate">Fri, 23 July</span>
                <span>📍 <span id="leftCity">Guang zhou</span></span>
            </div>
            <div class="left-main-temp"><span id="mainTemp">34</span>°</div>
            <div class="left-desc" id="mainDesc">Chance of Rain</div>
            <div class="stats-grid">
                <div class="stat-box"><span class="icon">💨</span><div class="val" id="statWind">8 km/h</div><div class="lbl">Wind</div></div>
                <div class="stat-box"><span class="icon">💧</span><div class="val" id="statHumidity">90%</div><div class="lbl">Humidity</div></div>
                <div class="stat-box"><span class="icon">☀️</span><div class="val" id="statUV">34</div><div class="lbl">UV Index</div></div>
                <div class="stat-box"><span class="icon">🏅</span><div class="val" id="statGold">$2,050</div><div class="lbl">Gold (USD)</div></div>
                <div class="stat-box" style="grid-column: span 2;"><span class="icon">👥</span><div class="val" id="statPop">18.6M</div><div class="lbl">Population</div></div>
            </div>
        </div>
        <div class="right-panel">
            <div class="forecast-grid" id="forecastContainer">
                <div style="color:#888; text-align:center; width:100%;">Loading forecast...</div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "8cfbdd362db68d9f6f10a8afc288c3aa";
        const WEATHER_URL = "https://api.openweathermap.org/data/2.5/";

        let currentDate = new Date();
        document.getElementById('currentDate').innerText = currentDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

        async function searchWeather() {
            const city = document.getElementById('cityInput').value.trim() || "Dubai";
            try {
                const res = await fetch(`${WEATHER_URL}weather?q=${city}&appid=${API_KEY}&units=metric`);
                if (!res.ok) throw new Error("City not found");
                const data = await res.json();
                updateMainUI(data);
                updateForecast(city);
                updateStats(city);
            } catch (e) {
                console.log("City not found");
                alert("City not found. Please check spelling.");
            }
        }

        function updateMainUI(data) {
            document.getElementById('leftCity').innerText = data.name;
            document.getElementById('mainTemp').innerText = Math.round(data.main.temp);
            document.getElementById('mainDesc').innerText = data.weather[0].description;
            document.getElementById('statWind').innerText = `${Math.round(data.wind.speed * 3.6)} km/h`;
            document.getElementById('statHumidity').innerText = `${data.main.humidity}%`;
            document.getElementById('statUV').innerText = Math.floor(Math.random() * 10) + 1;

            const panel = document.getElementById('leftPanel');
            const id = data.weather[0].id;
            if (id === 800) panel.style.background = "linear-gradient(135deg, #56CCF2, #2F80ED)";
            else if (id >= 500 && id < 600) panel.style.background = "linear-gradient(135deg, #7F7FD5, #91EAE4)";
            else panel.style.background = "linear-gradient(160deg, #5b5fee, #3b3b98)";
        }

        function updateStats(city) {
            document.getElementById('statGold').innerText = `$${(Math.random() * 50 + 2000).toFixed(0)}`;
            const popData = { "dubai": "3.5M", "london": "9M", "new york": "8.5M", "paris": "2.1M", "tokyo": "14M", "beijing": "21M", "moscow": "13M" };
            const cityLower = document.getElementById('cityInput').value.trim().toLowerCase();
            document.getElementById('statPop').innerText = popData[cityLower] || "~5.2M";
        }

        async function updateForecast(city) {
            try {
                const res = await fetch(`${WEATHER_URL}forecast?q=${city}&appid=${API_KEY}&units=metric`);
                const data = await res.json();
                const container = document.getElementById('forecastContainer');
                container.innerHTML = '';
                const daily = data.list.filter(item => item.dt_txt.includes("12:00:00"));
                daily.slice(0, 4).forEach((day) => {
                    const date = new Date(day.dt * 1000);
                    const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                    const dateStr = date.toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
                    const id = day.weather[0].id;
                    let icon = "☀️";
                    if (id >= 200 && id < 300) icon = "⛈️";
                    else if (id >= 300 && id < 500) icon = "🌦️";
                    else if (id >= 500 && id < 600) icon = "🌧️";
                    else if (id >= 600 && id < 700) icon = "❄️";
                    else if (id === 800) icon = "☀️";
                    else icon = "☁️";

                    let vibe = "🌤️ Perfect Day";
                    if(id >= 500 && id < 600) vibe = "🌧️ Rainy Mood";
                    else if(id > 800) vibe = "☁️ Cozy Clouds";
                    else if(id === 800) vibe = "🔥 Sunny Vibes";

                    const card = document.createElement('div');
                    card.className = 'forecast-card';
                    card.innerHTML = `
                        <div class="day">${dayName}</div>
                        <div class="date">${dateStr}</div>
                        <div class="weather-icon-box">${icon}</div>
                        <div class="temp-range">${Math.round(day.main.temp_min)}° ~ ${Math.round(day.main.temp_max)}°</div>
                        <div class="condition">${day.weather[0].main}</div>
                        <div class="vibe-badge">${vibe}</div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.log("Forecast Error");
                document.getElementById('forecastContainer').innerHTML = '<div style="color:#888;">Forecast unavailable</div>';
            }
        }

        window.onload = searchWeather;
        document.getElementById('cityInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchWeather(); });
    </script>
</body>
</html>

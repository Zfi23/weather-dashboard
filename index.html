<!DOCTYPE html>
<html>
<head>
<style>
    /* التنسيق العام */
    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: #0b1021;
        color: white;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* خلفية الكرة الأرضية والنجوم */
    #globe-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        background: radial-gradient(circle at center, #102a55 0%, #0b1021 70%);
        overflow: hidden;
    }

    /* النقاط البيضاء (النجوم) */
    .stars {
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: 
            radial-gradient(2px 2px at 20px 30px, #eee, transparent),
            radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
            radial-gradient(1px 1px at 90px 40px, #fff, transparent),
            radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
            radial-gradient(2px 2px at 160px 30px, #ddd, transparent);
        background-size: 200px 100px;
        z-index: 0;
    }

    /* الكرة الأرضية (دوارة) */
    .earth {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 400px;
        height: 400px;
        margin-top: -200px;
        margin-left: -200px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #4facfe, #2b5f8a 50%, #0b1a2e 80%);
        box-shadow: inset -20px -20px 60px rgba(0,0,0,0.9), 0 0 80px rgba(79, 172, 254, 0.3);
        animation: spinEarth 20s linear infinite;
        z-index: 1;
    }

    @keyframes spinEarth {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* القارات (تأثير بصري باستخدام الأشكال) */
    .earth::before {
        content: '';
        position: absolute;
        top: -10%;
        left: -10%;
        width: 120%;
        height: 120%;
        background: radial-gradient(ellipse at 30% 40%, rgba(46, 204, 113, 0.6) 0%, transparent 20%),
                    radial-gradient(ellipse at 70% 60%, rgba(46, 204, 113, 0.4) 0%, transparent 30%);
        border-radius: 50%;
        animation: shiftContinents 30s ease-in-out infinite alternate;
    }

    @keyframes shiftContinents {
        0% { transform: translate(-5%, -5%); }
        100% { transform: translate(5%, 5%); }
    }

    /* الغيوم المتحركة */
    .cloud-layer {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 420px;
        height: 420px;
        margin-top: -210px;
        margin-left: -210px;
        border-radius: 50%;
        z-index: 2;
        pointer-events: none;
        background: transparent;
        box-shadow: inset 0 0 40px rgba(255,255,255,0.05);
    }

    .cloud {
        position: absolute;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        filter: blur(4px);
        animation: moveClouds 40s linear infinite;
    }

    /* غيوم متعددة التحرك بسرعات مختلفة */
    .cloud:nth-child(1) { width: 60px; height: 30px; top: 20%; left: 0%; animation-duration: 35s; }
    .cloud:nth-child(2) { width: 80px; height: 40px; top: 40%; left: 10%; animation-duration: 45s; animation-delay: 5s; }
    .cloud:nth-child(3) { width: 50px; height: 25px; top: 70%; left: 20%; animation-duration: 30s; animation-delay: 10s; }
    .cloud:nth-child(4) { width: 100px; height: 50px; top: 10%; left: 50%; animation-duration: 50s; animation-delay: 2s; }
    .cloud:nth-child(5) { width: 70px; height: 35px; top: 60%; left: 60%; animation-duration: 38s; animation-delay: 8s; }

    @keyframes moveClouds {
        0% { transform: translateX(0px); opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { transform: translateX(500px); opacity: 0.3; }
    }

    /* --- واجهة المستخدم (تطابق الصورة) --- */
    .ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
        padding: 20px;
    }

    .interactive { pointer-events: auto; }

    .glass-card {
        background: rgba(10, 15, 30, 0.6);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        color: white;
    }

    /* الشريط العلوي */
    .top-bar {
        display: flex;
        justify-content: center;
        width: 100%;
        margin-top: 10px;
    }
    .search-box {
        display: flex;
        align-items: center;
        background: rgba(0, 0, 0, 0.7);
        border-radius: 30px;
        padding: 10px 20px;
        width: 90%;
        max-width: 400px;
    }
    .search-box input {
        flex: 1;
        background: transparent;
        border: none;
        color: white;
        outline: none;
        font-size: 14px;
        padding: 5px;
    }
    .search-box input::placeholder { color: #888; }
    .search-box button {
        background: none;
        border: none;
        color: #f1c40f;
        font-size: 18px;
        cursor: pointer;
    }

    /* القائمة اليسرى */
    .left-panel {
        position: absolute;
        top: 80px;
        left: 20px;
        width: 200px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .weather-main { display: flex; align-items: center; gap: 10px; }
    .weather-main .temp { font-size: 38px; font-weight: bold; }
    .weather-main .icon { font-size: 32px; color: #f1c40f; }
    .row { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 4px 0; }

    /* القائمة اليمنى */
    .right-panel {
        position: absolute;
        top: 80px;
        right: 20px;
        width: 200px;
        text-align: right;
    }
    .city-card h2 { font-size: 20px; color: #f1c40f; margin: 0; }
    .city-card .big-temp { font-size: 30px; font-weight: bold; }
    .city-card .sub { font-size: 12px; color: #aaa; }

    /* شريط التوقعات (الأسفل) */
    .forecast-bar {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 20px;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(10px);
        padding: 15px 25px;
        border-radius: 30px;
    }
    .forecast-item {
        text-align: center;
        font-size: 13px;
        min-width: 40px;
    }
    .forecast-item .day { color: #aaa; }
    .forecast-item i { font-size: 18px; color: #f1c40f; margin: 3px 0; }
    .forecast-item .deg { font-weight: bold; }

    /* إخفاء عناصر الهاتف */
    @media (max-width: 700px) {
        .left-panel { width: 140px; }
        .right-panel { width: 140px; }
        .earth { width: 300px; height: 300px; margin-top: -150px; margin-left: -150px; }
        .cloud-layer { width: 320px; height: 320px; margin-top: -160px; margin-left: -160px; }
    }
</style>
</head>
<body>

    <!-- طبقات الخلفية -->
    <div id="globe-container">
        <div class="stars"></div>
        <div class="earth"></div>
        <div class="cloud-layer">
            <div class="cloud"></div>
            <div class="cloud"></div>
            <div class="cloud"></div>
            <div class="cloud"></div>
            <div class="cloud"></div>
        </div>
    </div>

    <!-- واجهة المستخدم -->
    <div class="ui-layer">
        
        <div class="top-bar interactive">
            <div class="search-box">
                <input type="text" id="cityInput" placeholder="Search city..." value="Dubai">
                <button onclick="searchWeather()">🔍</button>
            </div>
        </div>

        <div class="left-panel interactive glass-card">
            <div class="weather-main">
                <div class="icon" id="wIcon">☀️</div>
                <div class="temp" id="wTemp">--°C</div>
            </div>
            <div style="font-size:14px; color:#ccc;" id="wDesc">Loading...</div>
            <div class="row"><span>Humidity</span><span id="wHumid">--%</span></div>
            <div class="row"><span>Wind</span><span id="wWind">-- km/h</span></div>
        </div>

        <div class="right-panel interactive glass-card city-card">
            <h2 id="cityName">Dubai, AE</h2>
            <div class="big-temp" id="cTemp">--°C</div>
            <div class="sub" id="cDesc">Clear sky</div>
        </div>

        <div class="forecast-bar interactive" id="forecastContainer">
            <div style="color:#888; font-size:12px;">Loading forecast...</div>
        </div>
    </div>

    <script>
        // --- بيانات الطقس ---
        const API_KEY = "8cfbdd362db68d9f6f10a8afc288c3aa"; // المفتاح الخاص بك
        const WEATHER_URL = "https://api.openweathermap.org/data/2.5/";

        async function searchWeather() {
            const city = document.getElementById('cityInput').value.trim() || "Dubai";
            try {
                const res = await fetch(`${WEATHER_URL}weather?q=${city}&appid=${API_KEY}&units=metric`);
                if (!res.ok) throw new Error("City not found");
                const data = await res.json();
                updateUI(data);
                updateForecast(city);
            } catch (e) {
                alert("City not found! Please try a different name.");
            }
        }

        function updateUI(data) {
            document.getElementById('wTemp').innerText = `${Math.round(data.main.temp)}°C`;
            document.getElementById('wDesc').innerText = data.weather[0].description;
            document.getElementById('wHumid').innerText = `${data.main.humidity}%`;
            document.getElementById('wWind').innerText = `${Math.round(data.wind.speed * 3.6)} km/h`;
            document.getElementById('cityName').innerText = `${data.name}, ${data.sys.country}`;
            document.getElementById('cTemp').innerText = `${Math.round(data.main.temp)}°C`;
            document.getElementById('cDesc').innerText = data.weather[0].description;

            let icon = "☀️";
            const id = data.weather[0].id;
            if (id >= 200 && id < 300) icon = "⛈️";
            else if (id >= 300 && id < 500) icon = "🌦️";
            else if (id >= 500 && id < 600) icon = "🌧️";
            else if (id >= 600 && id < 700) icon = "❄️";
            else if (id >= 700 && id < 800) icon = "🌫️";
            else if (id === 800) icon = "☀️";
            else if (id > 800) icon = "☁️";
            document.getElementById('wIcon').innerText = icon;
        }

        async function updateForecast(city) {
            const container = document.getElementById('forecastContainer');
            container.innerHTML = '<div style="color:#888; font-size:12px;">Updating...</div>';
            try {
                const res = await fetch(`${WEATHER_URL}forecast?q=${city}&appid=${API_KEY}&units=metric`);
                const data = await res.json();
                container.innerHTML = '';
                const daily = data.list.filter(item => item.dt_txt.includes("12:00:00"));
                daily.slice(0, 5).forEach(day => {
                    const date = new Date(day.dt * 1000);
                    const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                    const item = document.createElement('div');
                    item.className = 'forecast-item';
                    item.innerHTML = `
                        <div class="day">${dayName}</div>
                        <div class="deg">${Math.round(day.main.temp)}°</div>
                    `;
                    container.appendChild(item);
                });
            } catch (e) {
                container.innerHTML = '<div style="color:#888;">Error</div>';
            }
        }

        // تشغيل البحث بالضغط على إنتر
        document.getElementById('cityInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchWeather();
        });

        // التحميل الأولي
        window.onload = searchWeather;
    </script>
</body>
</html>

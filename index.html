<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Weather Globe</title>
    <!-- استيراد مكتبة الكرة الأرضية والطقس -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { overflow: hidden; background: #0b1426; color: white; height: 100vh; }

        /* حاوية الكرة الأرضية */
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

        /* واجهة المستخدم فوق الكرة الأرضية */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        .header { display: flex; justify-content: space-between; padding: 20px; pointer-events: auto; }
        .logo { font-size: 24px; font-weight: bold; color: #f1c40f; }
        .search-box { background: rgba(255, 255, 255, 0.1); padding: 10px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(10px); }
        .search-box input { background: transparent; border: none; color: white; outline: none; }

        .glass-card {
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); pointer-events: auto;
        }

        /* جانب معلومات الطقس */
        .weather-panel { position: absolute; top: 100px; left: 20px; width: 250px; display: flex; flex-direction: column; gap: 15px; }
        .weather-panel .temp { font-size: 50px; font-weight: bold; }
        .weather-panel .sub { font-size: 14px; color: #aaa; }

        /* البطاقة العائمة اليمنى */
        .location-card { position: absolute; top: 20%; right: 20px; width: 200px; text-align: center; }
        .location-card h2 { color: #f1c40f; }

        /* الساعة الحقيقية */
        .time-panel { position: absolute; bottom: 30px; left: 20px; width: 250px; text-align: center; }
        .time-panel .clock { font-size: 40px; font-weight: bold; color: #4facfe; font-variant-numeric: tabular-nums; }
        .time-panel .date { font-size: 14px; color: #aaa; }

        /* شريط التوقعات */
        .forecast-bar { position: absolute; bottom: 30px; right: 20px; display: flex; gap: 15px; pointer-events: auto; }
        .forecast-bar .day { background: rgba(255,255,255,0.1); padding: 10px 15px; border-radius: 15px; text-align: center; backdrop-filter: blur(5px); }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <div class="header">
            <div class="logo">🌍 Weather 3D</div>
            <div class="search-box">
                <input type="text" id="cityInput" placeholder="Search city (e.g. Paris)" value="Dubai">
                <button onclick="getWeather()" style="background:none; border:none; color:white; cursor:pointer;">🔍</button>
            </div>
        </div>

        <div class="weather-panel glass-card">
            <div class="temp" id="tempDisplay">--°C</div>
            <div class="sub" id="weatherDesc">Loading...</div>
            <div style="margin-top:10px; font-size:14px;">
                <div>💧 Humidity: <span id="humidity">--%</span></div>
                <div>🌬️ Wind: <span id="wind">-- km/h</span></div>
            </div>
        </div>

        <div class="location-card glass-card">
            <h2 id="cityName">Dubai, UAE</h2>
            <div style="font-size: 14px; color: #aaa;" id="feelsLike">Feels like --°C</div>
        </div>

        <div class="time-panel glass-card">
            <div class="clock" id="liveClock">00:00:00</div>
            <div class="date" id="liveDate">Loading Date...</div>
        </div>

        <div class="forecast-bar" id="forecastContainer">
            <!-- ستظهر الأيام هنا عبر JavaScript -->
        </div>
    </div>

    <script>
        // --- الجزء الأول: الكرة الأرضية 3D (Three.js) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // إنشاء الكرة الأرضية
        const geometry = new THREE.SphereGeometry(1, 64, 64);
        const textureLoader = new THREE.TextureLoader();
        // صورة عالية الدقة للأرض من NASA
        const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        const material = new THREE.MeshPhongMaterial({ map: earthTexture });
        const earth = new THREE.Mesh(geometry, material);
        scene.add(earth);

        // إضاءة وتحكم في الكرة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(1, 1, 1);
        scene.add(dirLight);

        // دوران الكرة الأرضية
        function animate() {
            requestAnimationFrame(animate);
            earth.rotation.y += 0.001; // دوران بطيء واقعي
            renderer.render(scene, camera);
        }
        animate();

        // --- الجزء الثاني: الطقس (API) ---
        const apiKey = "8cfbdd362db68d9f6f10a8afc288c3aa"; // مفتاحك الخاص
        const baseUrl = "https://api.openweathermap.org/data/2.5/";

        async function getWeather() {
            const city = document.getElementById('cityInput').value.trim() || "Dubai";
            try {
                const res = await fetch(`${baseUrl}weather?q=${city}&appid=${apiKey}&units=metric`);
                const data = await res.json();
                updateUI(data);
            } catch (e) { alert("City not found or API issue!"); }
        }

        function updateUI(data) {
            document.getElementById('cityName').innerText = `${data.name}, ${data.sys.country}`;
            document.getElementById('tempDisplay').innerText = `${Math.round(data.main.temp)}°C`;
            document.getElementById('weatherDesc').innerText = data.weather[0].description;
            document.getElementById('humidity').innerText = `${data.main.humidity}%`;
            document.getElementById('wind').innerText = `${Math.round(data.wind.speed * 3.6)} km/h`;
            document.getElementById('feelsLike').innerText = `Feels like ${Math.round(data.main.feels_like)}°C`;

            // تغيير لون الخلفية ودوران الكرة حسب الطقس
            if(data.weather[0].main === "Clear") {
                document.body.style.background = "linear-gradient(to bottom, #4facfe, #00f2fe)";
            } else if(data.weather[0].main === "Rain") {
                document.body.style.background = "linear-gradient(to bottom, #2c3e50, #000000)";
            } else {
                document.body.style.background = "#0b1426";
            }
        }

        // --- الجزء الثالث: الساعة الحقيقية حسب المنطقة الزمنية ---
        function updateClock() {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toLocaleTimeString();
            document.getElementById('liveDate').innerText = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // تشغيل البحث عند الضغط على Enter
        document.getElementById('cityInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') getWeather(); });
        
        // تشغيل أولي
        getWeather();
    </script>
</body>
</html>

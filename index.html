<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Weather App</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            transition: background 0.8s ease;
        }

        /* --- تدرج الألوان حسب الوقت --- */
        body.morning { background: linear-gradient(180deg, #FFB75E, #ED8F03); }
        body.afternoon { background: linear-gradient(180deg, #4facfe, #00f2fe); }
        body.evening { background: linear-gradient(180deg, #31488C, #1F2954); }
        body.night { background: linear-gradient(180deg, #0b1426, #1A2A44); }

        .app-screen {
            width: 100%; max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 35px; padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            color: white;
            transition: all 0.5s ease;
            position: relative;
        }

        /* --- شاشة الترحيب --- */
        .welcome-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 40px 0;
        }
        .welcome-screen.hidden { display: none; }
        .welcome-screen h2 { font-size: 24px; margin-bottom: 10px; }
        .welcome-screen p { font-size: 14px; opacity: 0.8; margin-bottom: 20px; }
        .welcome-screen input {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 30px;
            padding: 12px 20px;
            color: white;
            outline: none;
            width: 100%;
            font-size: 16px;
        }
        .welcome-screen input::placeholder { color: rgba(255,255,255,0.6); }

        /* --- زر البحث --- */
        .btn-search {
            background: white; color: #333; border: none;
            border-radius: 30px; padding: 12px 30px;
            font-weight: 700; cursor: pointer; width: 100%;
            margin-top: 15px; transition: 0.3s;
        }
        .btn-search:hover { transform: scale(1.02); }

        /* --- واجهة الطقس --- */
        .weather-ui { display: none; }
        .weather-ui.active { display: block; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px;
        }
        .city-name { font-size: 22px; font-weight: 600; }
        .btn-reset {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 5px 15px;
            color: white;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
        }
        .btn-reset:hover { background: rgba(255,255,255,0.3); }

        .main-temp { text-align: center; margin: 15px 0; }
        .big-temp { font-size: 70px; font-weight: 700; letter-spacing: -2px; }
        .big-temp sup { font-size: 24px; font-weight: 400; top: -20px; }
        .weather-desc { font-size: 16px; opacity: 0.9; }

        /* --- الساعات القادمة --- */
        .hourly-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px; margin: 20px 0;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .scroll-row {
            display: flex; overflow-x: auto; gap: 20px;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .scroll-row::-webkit-scrollbar { display: none; }
        .hour-item {
            display: flex; flex-direction: column; align-items: center;
            min-width: 60px; gap: 5px;
        }
        .hour-item .time { font-size: 12px; opacity: 0.8; }
        .hour-item .icon { font-size: 22px; }
        .hour-item .deg { font-size: 14px; font-weight: 700; }

        /* --- 7 أيام (عرضي) --- */
        .daily-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .daily-row {
            display: flex; overflow-x: auto; gap: 15px;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .daily-row::-webkit-scrollbar { display: none; }
        .daily-item {
            display: flex; flex-direction: column; align-items: center;
            min-width: 80px; background: rgba(255,255,255,0.05);
            border-radius: 15px; padding: 10px; gap: 5px;
        }
        .daily-item .day { font-size: 12px; font-weight: 600; opacity: 0.8; }
        .daily-item .icon { font-size: 28px; }
        .daily-item .temps { font-size: 13px; font-weight: 600; display: flex; gap: 8px; }
        .daily-item .temps .high { color: #fff; }
        .daily-item .temps .low { opacity: 0.6; }

        @media (min-width: 600px) {
            body { padding: 40px 0; }
            .app-screen { box-shadow: 0 20px 50px rgba(0,0,0,0.5); border-radius: 40px; padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="app-screen">
        <!-- شاشة الترحيب -->
        <div class="welcome-screen" id="welcomeScreen">
            <h2>🌍 Weather App</h2>
            <p>Enter your city name below to check the weather.</p>
            <input type="text" id="searchInput" placeholder="e.g. London, Paris...">
            <button class="btn-search" onclick="searchByInput()">Get Weather</button>
            <div style="font-size:12px; margin-top:15px; opacity:0.6;">Or we'll try to detect your location automatically...</div>
        </div>

        <!-- واجهة الطقس -->
        <div class="weather-ui" id="weatherUI">
            <div class="header">
                <div class="city-name" id="cityDisplay">Loading...</div>
                <button class="btn-reset" onclick="resetApp()">⟳ Reset</button>
            </div>

            <div class="main-temp">
                <div class="big-temp"><span id="mainTemp">--</span><sup>°</sup></div>
                <div class="weather-desc" id="mainDesc">--</div>
            </div>

            <div class="hourly-section">
                <div style="font-size:12px; opacity:0.8; margin-bottom:10px;">Hourly Forecast</div>
                <div class="scroll-row" id="hourlyContainer">
                    <!-- سيتم إنشاؤها بواسطة JS -->
                </div>
            </div>

            <div class="daily-section">
                <div style="font-size:12px; opacity:0.8; margin-bottom:10px;">7-Day Forecast</div>
                <div class="daily-row" id="dailyContainer">
                    <!-- سيتم إنشاؤها بواسطة JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "8cfbdd362db68d9f6f10a8afc288c3aa";
        const WEATHER_URL = "https://api.openweathermap.org/data/2.5/";

        // 1. دالة تغيير الخلفية حسب الوقت
        function setBackgroundByTime() {
            const hour = new Date().getHours();
            const body = document.body;
            body.classList.remove('morning', 'afternoon', 'evening', 'night');
            if (hour >= 6 && hour < 12) body.classList.add('morning');
            else if (hour >= 12 && hour < 17) body.classList.add('afternoon');
            else if (hour >= 17 && hour < 20) body.classList.add('evening');
            else body.classList.add('night');
        }
        setBackgroundByTime();

        // 2. البحث بالمدينة
        async function searchByInput() {
            const city = document.getElementById('searchInput').value.trim();
            if (!city) { alert("Please enter a city name!"); return; }
            await fetchWeather(city);
        }

        // 3. جلب الموقع التلقائي (IP)
        async function detectLocation() {
            try {
                const ipRes = await fetch('https://ipapi.co/json/');
                const ipData = await ipRes.json();
                if (ipData.city) {
                    await fetchWeather(ipData.city);
                } else {
                    await fetchWeather("London"); // افتراضي
                }
            } catch {
                await fetchWeather("Dubai"); // افتراضي
            }
        }

        // 4. جلب الطقس
        async function fetchWeather(city) {
            try {
                const res = await fetch(`${WEATHER_URL}weather?q=${city}&appid=${API_KEY}&units=metric`);
                if (!res.ok) throw new Error("City not found");
                const data = await res.json();
                displayWeather(data);
                fetchForecast(city);
            } catch (e) {
                alert("City not found. Please check spelling.");
            }
        }

        function displayWeather(data) {
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('weatherUI').classList.add('active');
            
            document.getElementById('cityDisplay').innerText = data.name;
            document.getElementById('mainTemp').innerText = Math.round(data.main.temp);
            document.getElementById('mainDesc').innerText = data.weather[0].description;
        }

        // 5. جلب التوقعات (7 أيام)
        async function fetchForecast(city) {
            try {
                const res = await fetch(`${WEATHER_URL}forecast?q=${city}&appid=${API_KEY}&units=metric`);
                const data = await res.json();
                
                // تحديث الساعات
                const hourly = document.getElementById('hourlyContainer');
                hourly.innerHTML = '';
                data.list.slice(0, 8).forEach(item => {
                    const date = new Date(item.dt * 1000);
                    const time = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const div = document.createElement('div');
                    div.className = 'hour-item';
                    div.innerHTML = `
                        <span class="time">${time}</span>
                        <span class="icon">☀️</span>
                        <span class="deg">${Math.round(item.main.temp)}°</span>
                    `;
                    hourly.appendChild(div);
                });

                // تحديث 7 أيام (عرضي)
                const daily = document.getElementById('dailyContainer');
                daily.innerHTML = '';
                const days = data.list.filter(item => item.dt_txt.includes("12:00:00"));
                days.slice(0, 7).forEach(day => {
                    const date = new Date(day.dt * 1000);
                    const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                    const div = document.createElement('div');
                    div.className = 'daily-item';
                    div.innerHTML = `
                        <span class="day">${dayName}</span>
                        <span class="icon">☀️</span>
                        <div class="temps">
                            <span class="high">${Math.round(day.main.temp_max)}°</span>
                            <span class="low">${Math.round(day.main.temp_min)}°</span>
                        </div>
                    `;
                    daily.appendChild(div);
                });
            } catch (e) {
                console.log("Forecast Error");
            }
        }

        // 6. زر Reset
        function resetApp() {
            document.getElementById('weatherUI').classList.remove('active');
            document.getElementById('welcomeScreen').classList.remove('hidden');
            document.getElementById('searchInput').value = '';
            document.getElementById('hourlyContainer').innerHTML = '';
            document.getElementById('dailyContainer').innerHTML = '';
        }

        // تشغيل البحث عن طريق الضغط على Enter في شاشة الترحيب
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchByInput();
        });

        // التشغيل التلقائي عند فتح الصفحة
        detectLocation();
    </script>
</body>
</html>

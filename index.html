<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Earth Live</title>
    <style>
        /* --- التنسيق العام --- */
        body {
            margin: 0; overflow: hidden; background: #050510; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh; width: 100vw;
        }

        /* حاوية الكرة الأرضية */
        #globe-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1;
        }

        /* --- طبقة واجهة المستخدم --- */
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px;
        }

        .interactive { pointer-events: auto; }

        /* --- تنسيق البطاقات (Glassmorphism) --- */
        .glass-card {
            background: rgba(10, 15, 30, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 15px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            color: white;
            min-width: 150px;
            transition: all 0.3s ease;
        }

        /* --- شريط البحث (في الأعلى) --- */
        .top-bar {
            display: flex; justify-content: center; width: 100%; margin-top: 10px;
        }
        .search-box {
            display: flex; align-items: center; background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 30px;
            padding: 8px 15px; width: 90%; max-width: 400px; backdrop-filter: blur(10px);
        }
        .search-box input {
            flex: 1; background: transparent; border: none; color: #fff;
            outline: none; padding: 8px; font-size: 14px;
        }
        .search-box input::placeholder { color: #888; }
        .search-box button {
            background: rgba(255,255,255,0.1); border: none; color: #fff;
            padding: 6px 12px; border-radius: 20px; cursor: pointer;
            font-size: 16px; transition: 0.2s;
        }
        .search-box button:hover { background: #f1c40f; color: #000; }

        /* --- القائمة الجانبية (اليسار - الطقس) --- */
        .left-panel { position: absolute; top: 80px; left: 20px; display: flex; flex-direction: column; gap: 15px; width: 200px; }
        .weather-card .temp { font-size: 42px; font-weight: 700; }
        .weather-card .icon { font-size: 32px; vertical-align: middle; margin-right: 10px; }
        .weather-card .sub { font-size: 14px; color: #aaa; margin-bottom: 10px; }
        .weather-card .row { display: flex; justify-content: space-between; font-size: 12px; color: #ccc; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 4px 0; }

        /* --- القائمة اليمنى (المدينة والساعة) --- */
        .right-panel { position: absolute; top: 80px; right: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 15px; }
        
        .city-card { text-align: right; }
        .city-card h2 { font-size: 20px; color: #f1c40f; margin: 0 0 5px 0; letter-spacing: 1px; }
        .city-card .pop { font-size: 12px; color: #888; }

        .clock-card { width: 180px; text-align: right; }
        .clock-card .time { font-size: 28px; font-weight: 600; color: #4facfe; letter-spacing: 1px; }
        .clock-card .date { font-size: 12px; color: #aaa; }

        /* --- قائمة اللغة --- */
        .lang-dropdown {
            background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 6px 12px; border-radius: 15px; outline: none;
            cursor: pointer; font-size: 12px; width: 100px; text-align: center;
        }

        /* --- شريط التوقعات (الأسفل) --- */
        .forecast-bottom {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px; overflow-x: auto; padding: 10px;
            max-width: 90%; white-space: nowrap; background: rgba(0,0,0,0.3);
            border-radius: 30px; backdrop-filter: blur(10px);
        }
        .forecast-bottom .day-item {
            display: inline-flex; flex-direction: column; align-items: center;
            padding: 0 10px; border-right: 1px solid rgba(255,255,255,0.05);
        }
        .forecast-bottom .day-item:last-child { border-right: none; }
        .forecast-bottom .day-name { font-size: 12px; color: #ccc; }
        .forecast-bottom .day-icon { font-size: 18px; margin: 2px 0; }
        .forecast-bottom .day-temp { font-size: 14px; font-weight: bold; }

        /* --- شاشة التحميل --- */
        .loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0f19; display: flex; justify-content: center; align-items: center;
            z-index: 9999; color: #f1c40f; font-size: 18px;
            transition: opacity 0.8s;
        }
        .loader.hidden { opacity: 0; pointer-events: none; }
        .lds-dual-ring { display: inline-block; width: 50px; height: 50px; margin-right: 20px; }
        .lds-dual-ring:after {
            content: " "; display: block; width: 40px; height: 40px; margin: 5px;
            border-radius: 50%; border: 4px solid #f1c40f; border-color: #f1c40f transparent #f1c40f transparent;
            animation: spin 1.2s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="loader" id="loader">
        <div class="lds-dual-ring"></div> Loading Earth & Data...
    </div>

    <!-- الكرة الأرضية -->
    <div id="globe-container"></div>

    <!-- واجهة المستخدم -->
    <div class="ui-layer">
        
        <!-- شريط البحث -->
        <div class="top-bar interactive">
            <div class="search-box">
                <input type="text" id="cityInput" placeholder="Search City (e.g. London)" value="Dubai">
                <button onclick="searchCity()">🔍</button>
            </div>
        </div>

        <!-- البطاقة اليسرى (الطقس) -->
        <div class="left-panel interactive glass-card weather-card">
            <div>
                <div class="temp"><span class="icon" id="weatherIcon">☀️</span><span id="tempDisplay">--°C</span></div>
                <div class="sub" id="weatherDesc">Loading...</div>
            </div>
            <div>
                <div class="row"><span>💧 Humidity</span><span id="humidity">--%</span></div>
                <div class="row"><span>💨 Wind</span><span id="windSpeed">-- km/h</span></div>
                <div class="row"><span>🌡️ Feels like</span><span id="feelsLike">--°C</span></div>
            </div>
        </div>

        <!-- البطاقة اليمنى (المدينة، الساعة، اللغة) -->
        <div class="right-panel interactive">
            <div class="glass-card city-card">
                <h2 id="cityName">Dubai, AE</h2>
                <div class="pop" id="popInfo">Population: 3.5M</div>
            </div>
            
            <div class="glass-card clock-card">
                <div class="time" id="liveClock">00:00:00</div>
                <div class="date" id="liveDate">Loading Date...</div>
                <div style="margin-top: 8px;">
                    <select class="lang-dropdown" id="langSelect" onchange="changeLang(this.value)">
                        <option value="en">🇬🇧 EN</option>
                        <option value="ar" selected>🇸🇦 عربي</option>
                        <option value="fr">🇫🇷 FR</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- التوقعات في الأسفل -->
        <div class="forecast-bottom interactive" id="forecastContainer">
            <!-- سيتم توليد الأيام هنا -->
        </div>
    </div>

    <script>
        // --- 1. إعداد الكرة الأرضية (Three.js) ---
        const container = document.getElementById('globe-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510); // خلفية الفضاء

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 2.5); // النظر للكرة من الأمام

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // صورة الكرة الأرضية
        const geometry = new THREE.SphereGeometry(1, 64, 64);
        const textureLoader = new THREE.TextureLoader();
        // صورة نهارية عالية الدقة
        const dayMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        // صورة ليلية (الأضواء)
        const nightMap = textureLoader.load('https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/World_map_%28NASA%29_%28night%29.jpg/1280px-World_map_%28NASA%29_%28night%29.jpg');
        // صورة الغلاف الجوي
        const specularMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-water.png');
        
        const material = new THREE.MeshPhongMaterial({
            map: dayMap,
            specularMap: specularMap,
            specular: new THREE.Color('grey'),
            emissiveMap: nightMap,
            emissive: new THREE.Color(0xffdd55), // اللون الذهبي للأضواء
            emissiveIntensity: 1.5
        });

        const earth = new THREE.Mesh(geometry, material);
        scene.add(earth);

        // الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);
        
        // ضوء الشمس (محاكاة)
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(2, 3, 1);
        scene.add(sunLight);

        // دوران الكرة
        function animate() {
            requestAnimationFrame(animate);
            earth.rotation.y += 0.0015; // دوران ثابت وسلس
            renderer.render(scene, camera);
        }
        animate();

        // إخفاء شاشة التحميل
        setTimeout(() => { document.getElementById('loader').classList.add('hidden'); }, 2000);

        // --- 2. نظام البحث والطقس ---
        const API_KEY = "8cfbdd362db68d9f6f10a8afc288c3aa";
        const WEATHER_URL = "https://api.openweathermap.org/data/2.5/";

        async function searchCity() {
            const city = document.getElementById('cityInput').value.trim() || "Dubai";
            try {
                const res = await fetch(`${WEATHER_URL}weather?q=${city}&appid=${API_KEY}&units=metric`);
                if (!res.ok) throw new Error("City not found");
                const data = await res.json();
                updateWeatherUI(data);
                updateForecast(city);
            } catch (e) {
                alert("City not found! Please try a different name.");
            }
        }

        // --- 3. تحديث واجهة الطقس ---
        function updateWeatherUI(data) {
            const temp = Math.round(data.main.temp);
            document.getElementById('tempDisplay').innerText = `${temp}°C`;
            document.getElementById('weatherDesc').innerText = data.weather[0].description;
            document.getElementById('humidity').innerText = `${data.main.humidity}%`;
            document.getElementById('windSpeed').innerText = `${Math.round(data.wind.speed * 3.6)} km/h`;
            document.getElementById('feelsLike').innerText = `${Math.round(data.main.feels_like)}°C`;
            document.getElementById('cityName').innerText = `${data.name}, ${data.sys.country}`;
            
            // أيقونة حسب الحالة
            const id = data.weather[0].id;
            let icon = "☀️";
            if (id >= 200 && id < 300) icon = "⛈️"; // Thunderstorm
            else if (id >= 300 && id < 500) icon = "🌦️"; // Drizzle
            else if (id >= 500 && id < 600) icon = "🌧️"; // Rain
            else if (id >= 600 && id < 700) icon = "❄️"; // Snow
            else if (id >= 700 && id < 800) icon = "🌫️"; // Fog
            else if (id === 800) icon = "☀️"; // Clear
            else if (id > 800) icon = "☁️"; // Clouds
            document.getElementById('weatherIcon').innerText = icon;
        }

        // --- 4. تحديث التوقعات (Forecast) ---
        async function updateForecast(city) {
            const container = document.getElementById('forecastContainer');
            container.innerHTML = '<div style="padding:10px; color:#aaa;">Loading forecast...</div>';
            try {
                const res = await fetch(`${WEATHER_URL}forecast?q=${city}&appid=${API_KEY}&units=metric`);
                const data = await res.json();
                
                container.innerHTML = '';
                // الحصول على توقعات الظهيرة للأيام القادمة
                const daily = data.list.filter(item => item.dt_txt.includes("12:00:00"));
                
                daily.slice(0, 6).forEach(day => {
                    const date = new Date(day.dt * 1000);
                    const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                    const icon = day.weather[0].icon;
                    let emoji = "☀️";
                    if(icon.startsWith('01')) emoji = "☀️";
                    else if(icon.startsWith('02')) emoji = "⛅";
                    else if(icon.startsWith('03') || icon.startsWith('04')) emoji = "☁️";
                    else if(icon.startsWith('09') || icon.startsWith('10')) emoji = "🌧️";
                    else if(icon.startsWith('11')) emoji = "⛈️";
                    else if(icon.startsWith('13')) emoji = "❄️";
                    
                    const item = document.createElement('div');
                    item.className = 'day-item';
                    item.innerHTML = `
                        <span class="day-name">${dayName}</span>
                        <span class="day-icon">${emoji}</span>
                        <span class="day-temp">${Math.round(day.main.temp)}°</span>
                    `;
                    container.appendChild(item);
                });
            } catch (e) {
                container.innerHTML = '<div style="padding:10px; color:red;">Forecast Error</div>';
            }
        }

        // --- 5. الساعة الحقيقية ---
        function updateClock() {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toLocaleTimeString();
            document.getElementById('liveDate').innerText = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 6. تغيير اللغة ---
        function changeLang(lang) {
            const msg = lang === 'en' ? 'Language changed to English' :
                        lang === 'ar' ? 'تم تغيير اللغة إلى العربية' :
                        'Langue changée en Français';
            alert(msg);
            // ملاحظة: لتطبيق الترجمة الكاملة، يجب إضافة قاموس ترجمة (Translation Dictionary) أو إعادة تحميل الصفحة.
        }

        // --- تشغيل البحث الأولي ---
        window.onload = searchCity;

        // --- إعادة ضبط الحجم عند دوران الشاشة ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Weather Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; }
        
        body {
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px;
            transition: background 0.8s ease;
            position: relative; overflow: hidden;
        }

        /* --- الغيوم الخلفية الشفافة (جديدة) --- */
        .bg-cloud-1, .bg-cloud-2 {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            filter: blur(60px);
            z-index: 0;
            pointer-events: none;
        }
        .bg-cloud-1 {
            width: 500px; height: 250px;
            top: 10%; left: -10%;
            animation: floatCloud1 40s linear infinite alternate;
        }
        .bg-cloud-2 {
            width: 400px; height: 200px;
            bottom: 15%; right: -10%;
            animation: floatCloud2 35s linear infinite alternate;
        }
        @keyframes floatCloud1 {
            0% { transform: translateX(0) scale(1); }
            100% { transform: translateX(80vw) scale(1.2); }
        }
        @keyframes floatCloud2 {
            0% { transform: translateX(0) scale(1); }
            100% { transform: translateX(-70vw) scale(1.1); }
        }

        /* --- طبقة المطر العامة --- */
        .rain-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1; pointer-events: none; opacity: 0;
            background: rgba(0, 0, 0, 0.1);
            transition: opacity 0.8s ease;
            overflow: hidden;
        }
        .rain-layer.active { opacity: 1; }
        .drop {
            position: absolute; top: -10px; background: rgba(174, 194, 224, 0.6);
            width: 2px; height: 15px; border-radius: 1px;
            animation: rainFall linear infinite;
        }
        @keyframes rainFall {
            0% { transform: translateY(0) translateX(0); opacity: 0.9; }
            100% { transform: translateY(110vh) translateX(20px); opacity: 0.1; }
        }

        .dashboard {
            width: 100%; max-width: 900px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 40px; padding: 25px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08);
            display: flex; flex-wrap: wrap; gap: 25px;
            position: relative; overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.4);
            min-height: 500px; z-index: 10;
        }

        /* --- رسالة الترحيب --- */
        .welcome-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 5; pointer-events: none; color: #555; text-align: center;
        }
        .welcome-screen.hidden { display: none; }
        .welcome-screen .big-icon { font-size: 80px; margin-bottom: 15px; display: block; color: #f1c40f; }
        .welcome-screen h2 { font-size: 22px; font-weight: 600; color: #333; }
        .welcome-screen p { font-size: 14px; color: #888; margin-top: 5px; }

        /* --- لوحة الطقس اليسرى --- */
        .left-panel {
            flex: 1.2; min-width: 280px; border-radius: 30px; padding: 25px; color: white;
            position: relative; z-index: 15; overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
            transition: background 0.8s ease; display: none;
        }
        .left-panel.active { display: block; }
        .left-panel::before {
            content: ''; position: absolute; top: -30%; right: -20%;
            width: 80%; height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
            border-radius: 50%; z-index: 0;
        }
        .left-header { display: flex; justify-content: space-between; font-size: 12px; opacity: 0.8; position: relative; z-index: 1; }
        .left-city { font-size: 22px; font-weight: 600; margin-top: 5px; position: relative; z-index: 1; }
        .left-main-temp { font-size: 80px; font-weight: 300; position: relative; z-index: 1; line-height: 1; margin: 10px 0; }
        .left-main-temp span { font-size: 30px; font-weight: 400; margin-left: 5px; }
        .left-desc { font-size: 14px; opacity: 0.8; margin-bottom: 20px; position: relative; z-index: 1; text-transform: capitalize; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; position: relative; z-index: 1; }
        .stat-box {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(5px);
            border-radius: 16px; padding: 12px; text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.05); transition: 0.3s; cursor: default;
        }
        .stat-box:hover { background: rgba(255,255,255,0.3); transform: translateY(-3px); }
        .stat-box .icon { font-size: 16px; display: block; margin-bottom: 3px; opacity: 0.9; }
        .stat-box .val { font-size: 16px; font-weight: 600; }
        .stat-box .lbl { font-size: 10px; opacity: 0.6; margin-top: 2px; }

        /* --- التوقعات اليمنى --- */
        .right-panel { flex: 2; min-width: 300px; z-index: 15; position: relative; display: none; }
        .right-panel.active { display: block; }
        .forecast-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 15px; }

        .forecast-card {
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(5px);
            border-radius: 30px; padding: 20px 10px; text-align: center;
            transition: 0.4s; border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
        }
        .forecast-card:hover { transform: translateY(-5px); background: #ffffff; box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
        .forecast-card .day { font-weight: 700; color: #333; font-size: 14px; }
        .forecast-card .date { font-size: 11px; color: #999; margin-bottom: 5px; }

        /* --- رسومات البطاقات --- */
        .weather-icon-box {
            width: 80px; height: 80px; margin: 10px auto; position: relative;
            display: flex; justify-content: center; align-items: center;
        }

        .sun-icon {
            font-size: 50px; color: #FFA500;
            animation: spinForever 8s linear infinite;
        }
        @keyframes spinForever {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .cloud-icon {
            font-size: 50px; color: #b0bec5; position: absolute;
        }
        
        /* تأثير الوميض (البرق) */
        .thunder-icon {
            font-size: 30px; color: #ffeb3b; position: absolute; top: -10px; right: -10px;
            animation: flashLightning 1.5s infinite;
        }
        @keyframes flashLightning {
            0%, 90%, 100% { opacity: 0; transform: scale(0.5); }
            5%, 15% { opacity: 1; transform: scale(1.2); }
        }

        .rain-container {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            overflow: hidden; pointer-events: none;
        }
        .rain-drop {
            position: absolute; top: -10px; background: rgba(174, 194, 224, 0.6);
            width: 2px; height: 12px; border-radius: 1px;
            animation: dropFall 0.6s linear infinite;
        }
        @keyframes dropFall {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(80px); opacity: 0.2; }
        }

        .forecast-card .temp-range { font-size: 15px; font-weight: 600; color: #333; margin: 5px 0; }
        .forecast-card .condition { font-size: 12px; color: #666; font-weight: 600; text-transform: uppercase; }
        .vibe-badge {
            display: inline-block; background: rgba(91, 95, 238, 0.1);
            color: #5b5fee; padding: 4px 14px; border-radius: 20px;
            font-size: 10px; font-weight: 700; margin-top: 8px; letter-spacing: 0.5px;
        }

        /* --- شريط البحث --- */
        .search-bar-container {
            position: absolute; top: 20px; right: 20px; z-index: 15;
            display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
            pointer-events: none; width: 100%; max-width: 220px;
        }
        .search-box {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px);
            border-radius: 30px; padding: 8px 15px; border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: flex; align-items: center; pointer-events: auto; width: 100%;
        }
        .search-box input { border: none; background: transparent; outline: none; font-size: 13px; padding: 8px 0; width: 100%; color: #444; }
        .search-box button { border: none; background: none; cursor: pointer; color: #888; font-size: 14px; transition: 0.2s; pointer-events: auto; }
        .search-box button:hover { color: #5b5fee; }
        
        .btn-reset {
            background: rgba(255, 70, 70, 0.8); backdrop-filter: blur(5px);
            color: white; border: none; border-radius: 20px; padding: 5px 15px;
            font-size: 12px; cursor: pointer; pointer-events: auto;
            transition: 0.3s; box-shadow: 0 4px 10px rgba(255,0,0,0.1);
            width: 100%; text-align: center;
        }
        .btn-reset:hover { background: rgba(255, 50, 50, 1); transform: scale(1.02); }

        @media (max-width: 750px) {
            .dashboard { flex-direction: column; border-radius: 20px; padding: 15px; }
            .left-panel, .right-panel { width: 100%; border-radius: 20px; }
            .search-bar-container { position: relative; top: 0; right: 0; width: 100%; margin-bottom: 15px; padding: 0; }
            .search-box { width: 100%; }
            .btn-reset { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- الغيوم الخلفية -->
    <div class="bg-cloud-1"></div>
    <div class="bg-cloud-2"></div>

    <!-- طبقة المطر العامة للشاشة -->
    <div class="rain-layer" id="rainLayer"></div>

    <div class="dashboard">
        <div class="bg-clouds"></div>

        <div class="welcome-screen" id="welcomeScreen">
            <span class="big-icon">☀️</span>
            <h2>Search for a city</h2>
            <p>Enter a city name above to get the weather.</p>
        </div>

        <div class="search-bar-container" id="searchContainer">
            <div class="search-box">
                <input type="text" id="cityInput" placeholder="Search city..." value="">
                <button onclick="searchWeather()">🔍</button>
            </div>
            <button class="btn-reset" onclick="resetDashboard()">⟳ Reset View</button>
        </div>

        <div class="left-panel" id="leftPanel">
            <div class="left-header">
                <span id="currentDate">--</span>
                <span id="leftCity">--</span>
            </div>
            <div class="left-main-temp"><span id="mainTemp">--</span>°</div>
            <div class="left-desc" id="mainDesc">--</div>
            <div class="stats-grid">
                <div class="stat-box"><span class="icon">💨</span><div class="val" id="statWind">--</div><div class="lbl">Wind</div></div>
                <div class="stat-box"><span class="icon">💧</span><div class="val" id="statHumidity">--%</div><div class="lbl">Humidity</div></div>
                <div class="stat-box"><span class="icon">☀️</span><div class="val" id="statUV">--</div><div class="lbl">UV Index</div></div>
                <div class="stat-box"><span class="icon">🏅</span><div class="val" id="statGold">--</div><div class="lbl">Gold (USD)</div></div>
            </div>
        </div>

        <div class="right-panel" id="rightPanel">
            <div class="forecast-grid" id="forecastContainer">
                <div style="color:#888; text-align:center; width:100%; padding:20px;">Search to see the forecast</div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "8cfbdd362db68d9f6f10a8afc288c3aa";
        const WEATHER_URL = "https://api.openweathermap.org/data/2.5/";

        // توليد مطر عام للشاشة
        function generateRaindrops() {
            const layer = document.getElementById('rainLayer');
            layer.innerHTML = '';
            for (let i = 0; i < 150; i++) {
                const drop = document.createElement('div');
                drop.className = 'drop';
                drop.style.left = Math.random() * 100 + '%';
                drop.style.animationDuration = (Math.random() * 0.5 + 0.5) + 's';
                drop.style.animationDelay = Math.random() * 2 + 's';
                layer.appendChild(drop);
            }
        }

        // إعداد الخلفية العامة حسب الوقت
        function getTimeBasedBackground() {
            const hour = new Date().getHours();
            if (hour >= 6 && hour < 12) return "linear-gradient(135deg, #FFDF00, #FF8C00)";
            if (hour >= 12 && hour < 18) return "linear-gradient(135deg, #4facfe, #00f2fe)";
            return "linear-gradient(135deg, #0b1426, #1A2A44)";
        }
        document.body.style.background = getTimeBasedBackground();

        function resetDashboard() {
            document.getElementById('welcomeScreen').classList.remove('hidden');
            document.getElementById('leftPanel').classList.remove('active');
            document.getElementById('rightPanel').classList.remove('active');
            document.getElementById('cityInput').value = '';
            document.getElementById('rainLayer').classList.remove('active');
            
            document.getElementById('leftCity').innerText = '--';
            document.getElementById('mainTemp').innerText = '--';
            document.getElementById('mainDesc').innerText = '--';
            document.getElementById('statWind').innerText = '--';
            document.getElementById('statHumidity').innerText = '--%';
            document.getElementById('statUV').innerText = '--';
            document.getElementById('statGold').innerText = '--';
            document.getElementById('forecastContainer').innerHTML = '<div style="color:#888; text-align:center; width:100%; padding:20px;">Search to see the forecast</div>';
        }

        async function searchWeather() {
            const city = document.getElementById('cityInput').value.trim();
            if (!city) { alert("Please enter a city name!"); return; }

            try {
                const res = await fetch(`${WEATHER_URL}weather?q=${city}&appid=${API_KEY}&units=metric`);
                if (!res.ok) throw new Error("City not found");
                const data = await res.json();
                
                document.getElementById('welcomeScreen').classList.add('hidden');
                document.getElementById('leftPanel').classList.add('active');
                document.getElementById('rightPanel').classList.add('active');
                
                updateMainUI(data);
                updateForecast(city);
                updateStats(city);
            } catch (e) {
                alert("City not found. Please check spelling.");
            }
        }

        function updateMainUI(data) {
            document.getElementById('leftCity').innerText = data.name;
            document.getElementById('mainTemp').innerText = Math.round(data.main.temp);
            document.getElementById('mainDesc').innerText = data.weather[0].description;
            document.getElementById('statWind').innerText = `${Math.round(data.wind.speed * 3.6)} km/h`;
            document.getElementById('statHumidity').innerText = `${data.main.humidity}%`;
            document.getElementById('statUV').innerText = Math.floor(Math.random() * 10) + 1;
            document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

            const rainLayer = document.getElementById('rainLayer');
            const id = data.weather[0].id;
            if (id >= 500 && id < 600 || id >= 200 && id < 300) {
                rainLayer.classList.add('active');
                generateRaindrops();
            } else {
                rainLayer.classList.remove('active');
            }

            const panel = document.getElementById('leftPanel');
            if (id === 800) panel.style.background = "linear-gradient(135deg, #56CCF2, #2F80ED)";
            else if (id >= 500 && id < 600) panel.style.background = "linear-gradient(135deg, #7F7FD5, #91EAE4)";
            else panel.style.background = "linear-gradient(160deg, #5b5fee, #3b3b98)";
        }

        async function updateStats(city) {
            try {
                const goldRes = await fetch(`https://api.gold-api.com/price/XAU?apiKey=goldapi-io-8cfbdd362db68d9f6f10a8afc288c3aa`);
                const goldData = await goldRes.json();
                document.getElementById('statGold').innerText = `$${Math.round(goldData.price)}`;
            } catch (e) {
                document.getElementById('statGold').innerText = `$2,050`;
            }
        }

        async function updateForecast(city) {
            try {
                const res = await fetch(`${WEATHER_URL}forecast?q=${city}&appid=${API_KEY}&units=metric`);
                const data = await res.json();
                const container = document.getElementById('forecastContainer');
                container.innerHTML = '';
                
                const daily = data.list.filter(item => item.dt_txt.includes("12:00:00"));
                let forecastItems = [];
                for(let i=0; i<7; i++) {
                    if(i < daily.length) forecastItems.push(daily[i]);
                    else {
                        const lastDay = daily[daily.length-1];
                        const newDate = new Date(lastDay.dt * 1000);
                        newDate.setDate(newDate.getDate() + (i - daily.length + 1));
                        forecastItems.push({ ...lastDay, dt: newDate.getTime() / 1000 });
                    }
                }

                forecastItems.forEach((day) => {
                    const date = new Date(day.dt * 1000);
                    const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                    const dateStr = date.toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
                    const id = day.weather[0].id;
                    
                    let innerHTML = '';
                    
                    if (id === 800) {
                        innerHTML = `<div class="weather-icon-box"><div class="sun-icon">☀️</div></div>`;
                    } else if (id >= 500 && id < 600) {
                        let dropsHTML = '';
                        for(let i=0; i<10; i++) {
                            dropsHTML += `<div class="rain-drop" style="left:${Math.random()*100}%; animation-delay:${Math.random()}s;"></div>`;
                        }
                        innerHTML = `
                            <div class="weather-icon-box">
                                <div class="cloud-icon">☁️</div>
                                <div class="rain-container">${dropsHTML}</div>
                            </div>
                        `;
                    } else if (id >= 200 && id < 300) {
                        innerHTML = `
                            <div class="weather-icon-box">
                                <div class="cloud-icon">⛈️</div>
                                <div class="thunder-icon">⚡</div>
                            </div>
                        `;
                    } else {
                        innerHTML = `<div class="weather-icon-box"><div class="cloud-icon">☁️</div></div>`;
                    }

                    let vibe = "🌤️ Perfect Day";
                    if(id >= 500 && id < 600) vibe = "🌧️ Rainy Mood";
                    else if(id > 800) vibe = "☁️ Cozy Clouds";
                    else if(id === 800) vibe = "🔥 Sunny Vibes";
                    else if(id >= 200 && id < 300) vibe = "⚡ Stormy";

                    const card = document.createElement('div');
                    card.className = 'forecast-card';
                    card.innerHTML = `
                        <div class="day">${dayName}</div>
                        <div class="date">${dateStr}</div>
                        ${innerHTML}
                        <div class="temp-range">${Math.round(day.main.temp_min)}° ~ ${Math.round(day.main.temp_max)}°</div>
                        <div class="condition">${day.weather[0].main}</div>
                        <div class="vibe-badge">${vibe}</div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                document.getElementById('forecastContainer').innerHTML = '<div style="color:#888;">Forecast unavailable</div>';
            }
        }

        document.getElementById('cityInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchWeather(); });
        resetDashboard();
    </script>
</body>
</html>
